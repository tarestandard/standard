<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Harbour Hotel — rooms by card</title></head>
<body>
<main><h1>Harbour Hotel</h1><p>Twelve rooms above the harbour.</p></main>
<button type="button" id="chat-launcher" class="hi-launcher-container chat-launcher" aria-label="Chat with the front desk">Chat with us</button>
<div id="chat" hidden>
  <div class="hi-webchat-container">
    <div class="hi-messages" id="chat-log"></div>
    <textarea class="hi-input" placeholder="Type your message" aria-label="Message"></textarea>
    <button type="button" class="hi-send" aria-label="Send message">Send</button>
  </div>
</div>
<script>
  // A bot that answers a room question with a card carousel inside its own
  // bubble: the shape the reader has to render as words (ADR-0041).
  const log = document.getElementById("chat-log");
  const input = document.querySelector(".hi-input");
  let turns = 0;
  const add = (who, text) => {
    const el = document.createElement("div");
    el.className = `hi-message hi-${who}`;
    el.setAttribute("data-sender", who === "bot" ? "bot" : "user");
    el.textContent = text;
    log.appendChild(el);
  };
  document.getElementById("chat-launcher").onclick = () => {
    document.getElementById("chat").hidden = false;
    add("bot", "Hello — I am the front desk assistant.");
  };
  document.querySelector(".hi-send").onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    add("user", text);
    input.value = "";
    turns += 1;
    if (turns === 1) {
      const bubble = document.createElement("div");
      bubble.className = "hi-message hi-bot";
      bubble.setAttribute("data-sender", "bot");
      bubble.innerHTML =
        "<p>Here are our rooms for tonight:</p>" +
        '<div class="hi-carousel">' +
        '<div class="hi-card"><img alt="Deluxe Harbour Room"><b>Deluxe Harbour Room</b><span>£185 per night</span><button type="button">Book</button></div>' +
        '<div class="hi-card"><img alt="Standard Twin"><b>Standard Twin</b><span>£140 per night</span><button type="button">Book</button></div>' +
        "</div>";
      log.appendChild(bubble);
    } else {
      add("bot", "Please choose one of the rooms above and I will hold it for you.");
    }
  };
</script>
</body>
</html>
