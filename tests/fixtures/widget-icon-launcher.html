<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Harbour Hotel — icon-only launcher</title></head>
<body>
<main><h1>Harbour Hotel</h1><p>Twelve rooms above the harbour.</p></main>
<!-- No aria-label, no text, no class the selector list predicts: only the
     screenshot can find this control (ADR-0043). It sits at the viewport centre
     so the test's hint can name it. -->
<button type="button" id="launch"
     style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#20241F;cursor:pointer">
  <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" style="margin:16px" fill="#E8E2D2"><path d="M4 4h16v12H7l-3 3z"/></svg>
</button>
<div id="chat" hidden>
  <div class="hi-webchat-container">
    <div class="hi-messages" id="chat-log"></div>
    <textarea class="hi-input" placeholder="Type your message" aria-label="Message"></textarea>
    <button type="button" class="hi-send" aria-label="Send message">Send</button>
  </div>
</div>
<script>
  const log = document.getElementById("chat-log");
  const input = document.querySelector(".hi-input");
  const add = (who, text) => {
    const el = document.createElement("div");
    el.className = `hi-message hi-${who}`;
    el.setAttribute("data-sender", who === "bot" ? "bot" : "user");
    el.textContent = text;
    log.appendChild(el);
  };
  document.getElementById("launch").onclick = () => { document.getElementById("chat").hidden = false; };
  document.querySelector(".hi-send").onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    add("user", text);
    input.value = "";
    add("bot", "Front desk here.");
  };
</script>
</body>
</html>
