name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Pinned, not `ubuntu-latest`: the label moves to Ubuntu 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build the published standard
        run: npm run build
      - name: Test the gates and the pages
        run: npm test
      - name: Lint
        run: npm run lint
