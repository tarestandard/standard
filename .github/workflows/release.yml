name: release

# A tag is a release: it builds the tagged tree, runs the same gate a pull
# request runs, deploys the Worker and smokes the live site. `workflow_dispatch`
# runs the same build for an infrastructure change that must deploy without
# inventing a version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Cancelling a deploy midway leaves a half-published
# site, so a second release waits for the first rather than cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned, not `ubuntu-latest`: the label moves to Ubuntu 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, build, test and lint
        run: npm run verify

      - name: Deploy the Worker and its assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.standard.jsonc

      # The deploy is not the release until the site serves it. This step fails
      # the run if the live site is missing a page, serves a different release
      # than the tag names, or lost the security headers.
      - name: Smoke the live site
        run: |
          set -euo pipefail
          base=https://tarestandard.org
          for path in / /agent /shopfront /editions/2026-11-14 /standard.json; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$base$path")
            if [ "$code" != "200" ]; then
              echo "$path returned $code"
              exit 1
            fi
          done
          curl -sL "$base/standard.json" -o /tmp/served.json
          if ! cmp -s standard.json /tmp/served.json; then
            echo "the site serves a different release than the tagged standard.json"
            exit 1
          fi
          if ! curl -sSI "$base/" | grep -qi '^x-content-type-options: nosniff'; then
            echo "the security headers are not applied"
            exit 1
          fi
          echo "the site serves the tagged release with its security headers"
